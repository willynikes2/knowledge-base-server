<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allow Access — Brain API</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0D0F14;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .card {
      background: #1a1d24;
      border: 1px solid #2a2d35;
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 380px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; color: #fff; }
    .subtitle { color: #888; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .info {
      background: #1e2228;
      border: 1px solid #2a2d35;
      border-radius: 8px;
      padding: 0.75rem;
      margin-bottom: 1.5rem;
      font-size: 0.82rem;
      color: #999;
      line-height: 1.4;
    }
    .info strong { color: #ccc; }
    .actions { display: flex; gap: 0.75rem; }
    button {
      flex: 1;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    #allow { background: #E53935; color: #fff; }
    #allow:hover { background: #c62828; }
    #deny { background: #2a2d35; color: #ccc; }
    #deny:hover { background: #333740; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error {
      background: #2d1b1b;
      border: 1px solid #E53935;
      border-radius: 8px;
      padding: 0.6rem;
      color: #ff6b6b;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    .error[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Brain API</h1>
    <p class="subtitle">Allow access to your knowledge base?</p>
    <div class="info">
      <strong id="client">An application</strong> wants to search, read and write your knowledge base.
    </div>
    <div id="error" class="error" hidden></div>
    <div class="actions">
      <button type="button" id="deny">Deny</button>
      <button type="button" id="allow">Allow</button>
    </div>
  </div>
  <script>
    // better-auth sends the signed authorization request here as query params.
    const oauthQuery = window.location.search.slice(1);
    const params = new URLSearchParams(oauthQuery);
    const errorEl = document.getElementById('error');
    const buttons = [document.getElementById('allow'), document.getElementById('deny')];

    if (params.get('client_id')) {
      fetch('/api/auth/oauth2/public-client?client_id=' + encodeURIComponent(params.get('client_id')), { credentials: 'include' })
        .then(res => (res.ok ? res.json() : null))
        .then(client => {
          if (client && client.client_name) document.getElementById('client').textContent = client.client_name;
        })
        .catch(() => {});
    }

    async function respond(accept) {
      errorEl.hidden = true;
      buttons.forEach(b => { b.disabled = true; });
      try {
        const res = await fetch('/api/auth/oauth2/consent', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ accept, oauth_query: oauthQuery }),
        });
        const data = await res.json().catch(() => ({}));
        const target = data.url || data.redirect_uri;
        if (!res.ok || !target) throw new Error(data.message || data.error_description || 'Could not complete authorization');
        window.location.href = target;
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.hidden = false;
        buttons.forEach(b => { b.disabled = false; });
      }
    }

    document.getElementById('allow').addEventListener('click', () => respond(true));
    document.getElementById('deny').addEventListener('click', () => respond(false));
  </script>
</body>
</html>
