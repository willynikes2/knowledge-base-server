<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KB Upload</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, system-ui, sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .container { width: 90%; max-width: 500px; padding: 2rem; }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; text-align: center; }
    .field { margin-top: 1rem; }
    .field label { display: block; margin-bottom: 0.3rem; font-size: 0.9rem; color: #aaa; }
    .field input { width: 100%; padding: 0.6rem; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #e0e0e0; font-size: 1rem; }
    .btn { margin-top: 1rem; width: 100%; padding: 0.75rem; border-radius: 8px; border: none; font-size: 1rem; cursor: pointer; font-weight: 600; }
    .btn-primary { background: #336; color: #fff; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-upload { background: #363; color: #fff; }
    .btn-upload:disabled { opacity: 0.4; cursor: not-allowed; }
    .error-msg { color: #c44; margin-top: 0.5rem; font-size: 0.85rem; display: none; }
    .status-bar { margin-bottom: 1rem; padding: 0.6rem 1rem; border-radius: 8px; font-size: 0.85rem; text-align: center; }
    .status-bar.ok { background: #1a2a1a; color: #6c6; border: 1px solid #2a3a2a; }
    .status-bar.fail { background: #2a1a1a; color: #c66; border: 1px solid #3a2a2a; }
    .status-bar.checking { background: #1a1a2a; color: #88f; border: 1px solid #2a2a3a; }
    .drop-zone { border: 2px dashed #444; border-radius: 12px; padding: 2rem 1rem; text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; }
    .drop-zone.over { border-color: #6cf; background: rgba(102,204,255,0.05); }
    .drop-zone.has-files { border-color: #6c6; border-style: solid; }
    .drop-zone p { font-size: 1.1rem; color: #888; }
    .drop-zone input { display: none; }
    .file-list { margin-top: 1rem; }
    .file-item { display: flex; align-items: center; gap: 0.5rem; background: #1a1a1a; border-radius: 8px; padding: 0.5rem 0.75rem; margin-bottom: 0.5rem; font-size: 0.85rem; }
    .file-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-item .size { color: #888; font-size: 0.8rem; }
    .file-item .remove { color: #c44; cursor: pointer; font-weight: bold; padding: 0 0.3rem; }
    .spinner { display: none; text-align: center; margin-top: 1rem; font-size: 0.9rem; color: #888; }
    .spinner.active { display: block; }
    .results { margin-top: 1.5rem; }
    .result { background: #1a1a1a; border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; font-size: 0.85rem; word-break: break-word; }
    .result.ok { border-left: 3px solid #4c4; }
    .result.err { border-left: 3px solid #c44; }
    .result .title { font-weight: 600; margin-bottom: 0.3rem; }
    .logout { margin-top: 1rem; text-align: center; }
    .logout a { color: #666; font-size: 0.8rem; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>
  <!-- Auth screen -->
  <div class="container" id="authScreen">
    <h1>KB Screenshot Upload</h1>
    <div class="field">
      <label for="apiKey">API Key</label>
      <input type="password" id="apiKey" placeholder="Paste your KB API key">
    </div>
    <button class="btn btn-primary" id="authBtn">Sign In</button>
    <p class="error-msg" id="authError"></p>
  </div>

  <!-- Upload screen -->
  <div class="container" id="uploadScreen" style="display:none;">
    <h1>KB Screenshot Upload</h1>
    <div class="status-bar checking" id="statusBar">Checking server...</div>
    <div class="drop-zone" id="dropZone">
      <p id="dropText">Tap to select images</p>
      <input type="file" id="fileInput" accept="image/*" multiple>
    </div>
    <div class="file-list" id="fileList"></div>
    <div class="field">
      <label for="cat">Category (optional)</label>
      <input type="text" id="cat" placeholder="e.g. screenshot, receipt, note">
    </div>
    <button class="btn btn-upload" id="uploadBtn" disabled>Upload</button>
    <div class="spinner" id="spinner">Uploading &amp; extracting text...</div>
    <div class="results" id="results"></div>
    <div class="logout"><a id="logoutLink">Sign out</a></div>
  </div>

  <script>
    // Elements
    const authScreen = document.getElementById('authScreen');
    const uploadScreen = document.getElementById('uploadScreen');
    const authBtn = document.getElementById('authBtn');
    const authError = document.getElementById('authError');
    const apiKeyInput = document.getElementById('apiKey');
    const statusBar = document.getElementById('statusBar');
    const dropZone = document.getElementById('dropZone');
    const dropText = document.getElementById('dropText');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const uploadBtn = document.getElementById('uploadBtn');
    const spinner = document.getElementById('spinner');
    const results = document.getElementById('results');
    const catInput = document.getElementById('cat');
    const logoutLink = document.getElementById('logoutLink');

    let apiKey = localStorage.getItem('kb_api_key') || '';
    let selectedFiles = [];

    // Auto-login if key saved
    if (apiKey) showUpload();

    // Auth
    authBtn.addEventListener('click', async () => {
      const key = apiKeyInput.value.replace(/\s+/g, '').trim();
      if (!key) return;
      authBtn.disabled = true;
      authBtn.textContent = 'Checking...';
      try {
        const res = await fetch('/api/v1/stats', { headers: { 'X-API-Key': key } });
        if (res.ok) {
          apiKey = key;
          localStorage.setItem('kb_api_key', key);
          showUpload();
        } else {
          showError(authError, 'Invalid API key');
        }
      } catch (e) {
        showError(authError, 'Connection error: ' + e.message);
      }
      authBtn.disabled = false;
      authBtn.textContent = 'Sign In';
    });

    apiKeyInput.addEventListener('keydown', e => { if (e.key === 'Enter') authBtn.click(); });

    logoutLink.addEventListener('click', () => {
      localStorage.removeItem('kb_api_key');
      apiKey = '';
      selectedFiles = [];
      uploadScreen.style.display = 'none';
      authScreen.style.display = 'block';
      apiKeyInput.value = '';
    });

    function showError(el, msg) {
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 5000);
    }

    // Upload screen
    async function showUpload() {
      authScreen.style.display = 'none';
      uploadScreen.style.display = 'block';
      await runHealthCheck();
    }

    async function runHealthCheck() {
      statusBar.className = 'status-bar checking';
      statusBar.textContent = 'Checking server...';
      try {
        const [healthRes, statsRes] = await Promise.all([
          fetch('/api/v1/health'),
          fetch('/api/v1/stats', { headers: { 'X-API-Key': apiKey } }),
        ]);
        if (!healthRes.ok) throw new Error('Server unreachable');
        if (!statsRes.ok) {
          statusBar.className = 'status-bar fail';
          statusBar.textContent = 'Auth failed \u2014 key may be invalid';
          localStorage.removeItem('kb_api_key');
          return;
        }
        const stats = await statsRes.json();
        statusBar.className = 'status-bar ok';
        statusBar.textContent = 'Ready \u2014 ' + stats.total_documents + ' docs in KB';
      } catch (e) {
        statusBar.className = 'status-bar fail';
        statusBar.textContent = 'Server offline: ' + e.message;
      }
    }

    // File selection (no auto-upload)
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('over');
      addFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', () => {
      addFiles(fileInput.files);
      fileInput.value = '';
    });

    function addFiles(files) {
      for (const f of files) {
        if (!selectedFiles.some(s => s.name === f.name && s.size === f.size)) {
          selectedFiles.push(f);
        }
      }
      renderFileList();
    }

    function renderFileList() {
      fileList.textContent = '';
      selectedFiles.forEach((f, i) => {
        const item = document.createElement('div');
        item.className = 'file-item';

        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = f.name;

        const size = document.createElement('span');
        size.className = 'size';
        size.textContent = formatSize(f.size);

        const remove = document.createElement('span');
        remove.className = 'remove';
        remove.textContent = '\u00D7';
        remove.addEventListener('click', () => {
          selectedFiles.splice(i, 1);
          renderFileList();
        });

        item.appendChild(name);
        item.appendChild(size);
        item.appendChild(remove);
        fileList.appendChild(item);
      });

      uploadBtn.disabled = selectedFiles.length === 0;
      if (selectedFiles.length > 0) {
        dropZone.classList.add('has-files');
        dropText.textContent = selectedFiles.length + ' file' + (selectedFiles.length > 1 ? 's' : '') + ' selected \u2014 tap to add more';
      } else {
        dropZone.classList.remove('has-files');
        dropText.textContent = 'Tap to select images';
      }
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(1) + ' MB';
    }

    // Upload on button click
    uploadBtn.addEventListener('click', async () => {
      if (!selectedFiles.length) return;
      uploadBtn.disabled = true;
      spinner.classList.add('active');
      const toUpload = [...selectedFiles];
      selectedFiles = [];
      renderFileList();
      for (const file of toUpload) {
        await uploadOne(file);
      }
      spinner.classList.remove('active');
      uploadBtn.disabled = false;
      await runHealthCheck(); // refresh doc count
    });

    async function uploadOne(file) {
      const form = new FormData();
      form.append('image', file);
      const cat = catInput.value.trim();
      if (cat) form.append('category', cat);
      form.append('save_to_vault', 'true');

      try {
        const res = await fetch('/api/v1/ingest/image', {
          method: 'POST',
          headers: { 'X-API-Key': apiKey },
          body: form,
        });
        const data = await res.json();
        addResult(res.ok ? 'ok' : 'err', file.name, res.ok
          ? (data.title || 'Ingested') + ' \u2014 ' + (data.extracted_chars || 0) + ' chars extracted'
          : 'Error: ' + (data.error || res.statusText));
      } catch (e) {
        addResult('err', file.name, 'Network error: ' + e.message);
      }
    }

    function addResult(type, filename, detail) {
      const div = document.createElement('div');
      div.className = 'result ' + type;
      const titleEl = document.createElement('div');
      titleEl.className = 'title';
      titleEl.textContent = filename;
      const detailEl = document.createElement('div');
      detailEl.textContent = detail;
      div.appendChild(titleEl);
      div.appendChild(detailEl);
      results.prepend(div);
    }
  </script>
</body>
</html>
